{% extends "layouts/auth.html" %}
{% block title %}Link inválido{% endblock %}
{% block content %}
<span class="inline-flex size-12 items-center justify-center rounded-lg bg-negative-soft text-negative">{{ icon("circle-x", "size-6") }}</span>
<h1 class="mt-6 text-2xl font-bold tracking-tight">Link inválido</h1>
<p class="mt-3 text-sm text-muted">{{ detail }}</p>
<div class="mt-8 flex flex-col gap-3">
  {% if retry_url %}<a href="{{ retry_url }}" class="btn btn-primary">Solicitar novo link</a>{% endif %}
  <a href="/login" class="btn btn-secondary">Ir para o login</a>
</div>
{% endblock %}
