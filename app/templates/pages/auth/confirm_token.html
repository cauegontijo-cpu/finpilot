{% extends "layouts/auth.html" %}
{% from "components/ui.html" import csrf %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<span class="inline-flex size-12 items-center justify-center rounded-2xl bg-primary-soft text-primary">{{ icon("shield-check", "size-6") }}</span>
<h1 class="mt-6 text-2xl font-bold tracking-tight">{{ title }}</h1>
<p class="mt-3 text-sm text-muted">Clique no botão abaixo para concluir a confirmação.</p>
<form method="post" action="{{ action }}" class="mt-8">
  {{ csrf() }}
  <input type="hidden" name="token" value="{{ token }}">
  <button type="submit" class="btn btn-primary w-full">{{ icon("circle-check") }} Confirmar</button>
</form>
{% endblock %}
