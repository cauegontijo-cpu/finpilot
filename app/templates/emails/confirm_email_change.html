{% extends "emails/_base.html" %}
{% block body %}
<p>Olá, {{ name }}.</p>
<p>Confirme que este é o novo e-mail da sua conta. O link expira em {{ hours }} horas.</p>
<p style="margin:24px 0"><a href="{{ link }}" style="background:#2563eb;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600">Confirmar novo e-mail</a></p><p style="font-size:13px;color:#64748b">Se o botão não funcionar, copie e cole este endereço no navegador:<br>{{ link }}</p>
{% endblock %}
