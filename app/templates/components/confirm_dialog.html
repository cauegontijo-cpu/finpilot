<dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-title">
  <div class="p-6">
    <div class="flex items-start gap-4">
      <span class="inline-flex size-10 shrink-0 items-center justify-center rounded-full bg-negative-soft text-negative">{{ icon("triangle-alert", "size-5") }}</span>
      <div class="min-w-0 flex-1">
        <h2 id="confirm-title" class="text-base font-semibold">Confirmar ação</h2>
        <p class="mt-1 text-sm text-muted" data-confirm-message></p>
        <div class="mt-4" data-confirm-type-box hidden>
          <label class="label" for="confirm-type-input">Para confirmar, digite <strong class="text-fg" data-confirm-expected></strong></label>
          <input id="confirm-type-input" class="input" autocomplete="off" data-confirm-type-input>
        </div>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" class="btn btn-secondary" data-close-dialog>Cancelar</button>
      <button type="button" class="btn btn-danger" data-confirm-ok>Confirmar</button>
    </div>
  </div>
</dialog>
