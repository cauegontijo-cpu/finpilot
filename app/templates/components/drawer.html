{# Cabeçalho padrão de drawer/modal. Uso: {% with title="...", subtitle="..." %}{% include "components/drawer.html" %}{% endwith %} #}
<div class="flex items-start justify-between gap-4 border-b border-line px-6 py-5">
  <div>
    <h2 id="{{ 'drawer-title' if not modal else 'modal-title' }}" class="text-lg font-semibold">{{ title }}</h2>
    {% if subtitle %}<p class="mt-0.5 text-sm text-muted">{{ subtitle }}</p>{% endif %}
  </div>
  {% if is_htmx %}
  <button type="button" class="btn-icon -mr-2" data-close-dialog aria-label="Fechar">{{ icon("x", "size-5") }}</button>
  {% endif %}
</div>
