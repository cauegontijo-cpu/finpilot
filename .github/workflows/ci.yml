name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.12"
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run mypy
      - name: Proibições automáticas (float monetário, SQL interpolado, TODO)
        run: |
          ! grep -rnE "float\(" app/domain/money.py app/services/ledger.py app/services/transactions.py app/services/transfers.py app/services/cards.py
          ! grep -rnE "text\(f[\"']" app --include=*.py | grep -v "pg_try_advisory_lock\|pg_advisory_unlock"
          ! grep -rn "TODO" app --include=*.py

  tests:
    name: Testes (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finpilot_test
          POSTGRES_PASSWORD: finpilot_test
          POSTGRES_DB: finpilot_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U finpilot_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://finpilot_test:finpilot_test@127.0.0.1:5433/finpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.12"
      - run: uv sync --frozen
      - name: Migrations em banco vazio (upgrade → downgrade → upgrade)
        env:
          MIGRATOR_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Suíte completa com cobertura
        run: uv run pytest --cov=app/services --cov=app/domain --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: finpilot:ci
