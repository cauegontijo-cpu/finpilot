[project]
name = "finpilot"
version = "0.1.0"
description = "FinPilot — plataforma de gestão financeira pessoal (FastAPI + PostgreSQL + HTMX)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "playwright>=1.47",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "N", "PL", "TID", "ERA", "PTH", "DTZ",
]
ignore = [
    "PLR0913",  # serviços recebem vários parâmetros nomeados de forma explícita
    "PLR2004",  # constantes de domínio pequenas são legíveis no ponto de uso
    "RUF001", "RUF002", "RUF003",  # textos em pt-BR com acentuação
    "B008",     # FastAPI usa Depends() em valores padrão
    "E501",     # o formatador (ruff format) é a referência de quebra de linha
    "PLR0917",  # construtores de dataclasses de entrada com campos posicionais explícitos
    "N818",     # exceções de domínio nomeadas pelo significado (ex.: InsufficientFunds)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "S311", "DTZ001", "PLC0415"]
"scripts/**" = ["S311", "T201"]
"alembic/**" = ["ERA001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"decimal.getcontext".msg = "Use as funções de app.domain.money para conversões monetárias."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: testes de ponta a ponta com navegador (Playwright) contra a aplicação em execução",
    "concurrency: testes com múltiplas conexões reais ao PostgreSQL",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
