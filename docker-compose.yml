# Ambiente de DESENVOLVIMENTO. Para produção use docker-compose.prod.yml.
# Portas publicadas somente em 127.0.0.1.
name: finpilot

x-app-env: &app-env
  ENV: development
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
  BASE_URL: ${BASE_URL:-http://localhost:8000}
  DATABASE_URL: postgresql+psycopg://finpilot_app:${APP_DB_PASSWORD}@postgres:5432/finpilot
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  DEMO_EMAIL: ${DEMO_EMAIL:-}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: finpilot
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Banco efêmero para a suíte de testes (dados em memória).
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finpilot_test
      POSTGRES_PASSWORD: finpilot_test
      POSTGRES_DB: finpilot_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot_test -d finpilot_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"   # interface web
      - "127.0.0.1:1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://finpilot_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/finpilot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment: *app-env
    volumes:
      - ./app:/app/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build: .
    command: ["python", "-m", "app.jobs.scheduler"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
