# PRODUÇÃO (servidor Linux). Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# - Somente o Caddy publica portas (80/443). PostgreSQL e Redis ficam apenas na rede interna.
# - HTTPS automático (Let's Encrypt) pelo Caddy; HSTS enviado pela aplicação sob HTTPS.
name: finpilot-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  ENV: production
  SECRET_KEY: ${SECRET_KEY:?}
  BASE_URL: https://${DOMAIN:?}
  ALLOWED_HOSTS: '["${DOMAIN}"]'
  COOKIE_SECURE: "true"
  DATABASE_URL: postgresql+psycopg://finpilot_app:${APP_DB_PASSWORD:?}@postgres:5432/finpilot
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  RATE_LIMIT_BACKEND: redis
  EMAIL_BACKEND: smtp
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: "true"
  MAIL_FROM: ${MAIL_FROM:?}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  LOG_LEVEL: INFO

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  web:
    image: ${IMAGE:-finpilot:latest}
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false" # o serviço migrate aplica as migrations com o papel de DDL
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  migrate:
    image: ${IMAGE:-finpilot:latest}
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://finpilot_migrator:${MIGRATOR_DB_PASSWORD:?}@postgres:5432/finpilot
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    logging: *logging

  scheduler:
    image: ${IMAGE:-finpilot:latest}
    build: .
    command: ["python", "-m", "app.jobs.scheduler"]
    healthcheck:
      disable: true  # não serve HTTP; o HEALTHCHECK da imagem é para o web
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      APP_DB_NAME: finpilot
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finpilot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    logging: *logging

networks:
  edge:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
